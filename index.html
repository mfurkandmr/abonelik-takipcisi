<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Abonelik Takipçisi</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="hero">
    <div class="wrap">
      <h1 class="brand">Abonelik Takipçisi</h1>

      <div class="figures">
        <p class="big"><span id="monthly-total">0 TL</span> <small>her ay</small></p>
        <p class="year">Yılda <strong id="yearly-total">0 TL</strong> eder.</p>
      </div>

      <section class="calendar" aria-labelledby="month-name">
        <h2 id="month-name" class="month-name"></h2>
        <div id="month-strip" class="strip" aria-hidden="true"></div>
        <p class="legend">Dolu günlerde ödeme var. Çerçeveli gün bugün.</p>
      </section>

      <section class="soon" aria-labelledby="soon-title">
        <h2 id="soon-title">Yaklaşan ödemeler</h2>
        <ul id="upcoming-list" class="soon-list"></ul>
      </section>
    </div>
  </header>

  <main class="wrap layout">
    <section class="subs" aria-labelledby="list-title">
      <h2 id="list-title">Aboneliklerim</h2>
      <div id="category-filter" class="chips" role="group" aria-label="Kategoriye göre filtrele"></div>
      <ul id="sub-list" class="sub-list"></ul>
    </section>

    <section class="panel" aria-labelledby="add-title">
      <h2 id="add-title">Abonelik ekle</h2>
      <form id="sub-form" novalidate>
        <label>Ad
          <input name="name" type="text" placeholder="Netflix" autocomplete="off">
        </label>
        <div class="pair">
          <label>Aylık ücret (TL)
            <input name="price" type="number" step="0.01" min="0" inputmode="decimal" placeholder="150">
          </label>
          <label>Yenilenme günü (1-31)
            <input name="day" type="number" min="1" max="31" inputmode="numeric" placeholder="15">
          </label>
        </div>
        <label>Kategori
          <select name="category">
            <option>Eğlence</option>
            <option>Müzik</option>
            <option>Yazılım</option>
            <option>Eğitim</option>
            <option selected>Diğer</option>
          </select>
        </label>
        <p id="errors" class="errors" role="alert"></p>
        <div class="form-actions">
          <button type="submit" id="submit-btn" class="btn">Ekle</button>
          <button type="button" id="cancel-edit" class="btn ghost" hidden>İptal</button>
        </div>
      </form>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
