<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Abonelik Takipçisi</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1>Abonelik Takipçisi</h1>

    <section aria-labelledby="add-title">
      <h2 id="add-title">Abonelik ekle</h2>
      <form id="sub-form" novalidate>
        <label>Ad
          <input name="name" type="text" placeholder="Netflix">
        </label>
        <label>Aylık ücret (TL)
          <input name="price" type="number" step="0.01" min="0" placeholder="150">
        </label>
        <label>Yenilenme günü (1-31)
          <input name="day" type="number" min="1" max="31" placeholder="15">
        </label>
        <button type="submit">Ekle</button>
      </form>
      <p id="errors" role="alert"></p>
    </section>

    <section aria-labelledby="summary-title">
      <h2 id="summary-title">Özet</h2>
      <p class="total">Aylık toplam: <strong id="monthly-total">0 TL</strong></p>
      <h3>Yaklaşan ödemeler (7 gün)</h3>
      <ul id="upcoming-list"></ul>
    </section>

    <section aria-labelledby="list-title">
      <h2 id="list-title">Aboneliklerim</h2>
      <ul id="sub-list"></ul>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
